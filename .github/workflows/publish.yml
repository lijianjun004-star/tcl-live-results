name: Publish result snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '33 0-17/2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: results-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Every trigger (push, manual, schedule) rebuilds the page from the newest collector logs, so a push can
      # never put the old committed snapshot back online. If the refresh fails, the job stops here: nothing is
      # uploaded or deployed and the last good page stays online.
      - name: Refresh from existing collector logs
        env:
          GH_TOKEN: ${{ secrets.RESULTS_READ_TOKEN || github.token }}
          MAIN_DIR: ${{ runner.temp }}/results-config
        run: |
          bash dash/refresh.sh
          cp dash/universal/index.html docs/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - uses: actions/deploy-pages@v5
        id: deploy
