name: Result snapshot offline regression
on:
  pull_request:
    paths: ['dash/**', 'tests/**', '.github/workflows/**']
  push:
    branches: ['fix/snapshot-data-and-freshness-20261116']
permissions:
  contents: read
jobs:
  snapshot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: bash -n dash/refresh.sh
